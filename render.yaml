services:
  - type: web
    name: faisals-classroom
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: faisals-classroom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: faisals-classroom-db
    plan: starter
